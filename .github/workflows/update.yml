name: Weekly Market Scan

on:
  schedule:
    # Runs automatically at 23:00 UTC every Sunday
    - cron: '0 23 * * 0'
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run Market Scan
        run: python update_scanner.py

      - name: Commit and push fresh data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto-update market data" || exit 0
          git push
