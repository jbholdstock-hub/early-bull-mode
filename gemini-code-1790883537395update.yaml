name: Scheduled Market Scan

on:
  schedule:
    # Runs every Sunday at 23:00 UTC (before markets open Monday)
    - cron: '0 23 * * 0'
  workflow_dispatch: # Allows you to press a "Run workflow" button manually anytime

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run scanner script
        run: python update_scanner.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Automated weekly market scan update" || exit 0
          git push